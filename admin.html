<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Адмін-панель</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #f8f9fa; --text: #1c1f23; --muted: #6b7280;
  --border: #e3e5e8; --accent: #2563eb; --accent-text: #ffffff; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #1b1e24; --panel2: #22262d; --text: #e8eaed; --muted: #9aa0a6;
    --border: #2d323a; --accent: #5b8def; --accent-text: #0b1020; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #1b1e24; --panel2: #22262d; --text: #e8eaed; --muted: #9aa0a6;
  --border: #2d323a; --accent: #5b8def; --accent-text: #0b1020; --shadow: 0 1px 3px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.hidden { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* кнопки та поля */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; }
.btn:hover { filter: brightness(.96); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.input, select.input, textarea.input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); outline: none; }
.input:focus { border-color: var(--accent); }
textarea.input { resize: vertical; min-height: 90px; }

/* вхід */
#login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
.login-card h1 { margin: 0 0 4px; font-size: 22px; }
.login-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.login-card .input { margin-bottom: 10px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0; }

/* каркас */
#app { display: flex; min-height: 100%; }
#side { width: 230px; flex: none; background: var(--panel); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
#side h2 { margin: 0 8px 14px; font-size: 17px; }
#side a.nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--text); text-decoration: none; }
#side a.nav:hover { background: var(--panel2); }
#side a.nav.active { background: var(--accent); color: var(--accent-text); }
#side .grow { flex: 1; }
.nbadge { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
#side a.nav.active .nbadge { background: #fff; color: var(--danger); }
#content { flex: 1; min-width: 0; }
#top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
#top h1 { margin: 0; font-size: 20px; flex: 1; }
.me { display: flex; align-items: center; gap: 8px; }
#main { padding: 22px 24px 60px; max-width: 1200px; }

/* компоненти */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 26px; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.warn b { color: var(--warn); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
.panel > h3 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--border); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .input { max-width: 280px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; }
.tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row.banned { background: rgba(220,38,38,.07); }
.row .info { flex: 1; min-width: 0; }
.row .info p { margin: 0; }
.row .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--panel2); flex: none; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .3px; margin-left: 6px; vertical-align: middle; background: var(--panel2); border: 1px solid var(--border); }
.tag.owner { background: #dc2626; color: #fff; border-color: #dc2626; }
.tag.admin { background: #7c3aed; color: #fff; border-color: #7c3aed; }
.tag.photomod { background: #0891b2; color: #fff; border-color: #0891b2; }
.tag.ban { background: var(--danger); color: #fff; border-color: var(--danger); }
.tag.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.more { text-align: center; padding: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.pcard img.ph { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--panel2); cursor: zoom-in; display: block; }
.pcard .body { padding: 10px 12px; flex: 1; }
.pcard .body p { margin: 0 0 3px; }
.pcard .acts { display: flex; gap: 6px; padding: 0 12px 12px; flex-wrap: wrap; }
.thumb { width: 56px; height: 42px; border-radius: 8px; object-fit: cover; background: var(--panel2); flex: none; cursor: zoom-in; }
.form { padding: 16px; display: grid; gap: 10px; max-width: 640px; }

/* діалог, лайтбокс, тост */
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.dlg-box { width: 100%; max-width: 440px; background: var(--panel); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.dlg-box h3 { margin: 0 0 8px; }
.dlg-box p { margin: 0 0 12px; color: var(--muted); }
.dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 60; cursor: zoom-out; padding: 16px; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 70; }
.toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--ok); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: 340px; }
.toast.err { border-left-color: var(--danger); }

@media (max-width: 860px) {
  #app { flex-direction: column; }
  #side { width: 100%; height: auto; position: static; flex-direction: row; overflow-x: auto; padding: 8px; align-items: center; }
  #side h2 { display: none; }
  #side .grow { display: none; }
  #nav { display: flex; gap: 4px; }
  #side a.nav { white-space: nowrap; }
  .cols { grid-template-columns: 1fr; }
  #main { padding: 16px; }
  .row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <h1>🛡️ Адмін-панель</h1>
    <p>Вхід для власника, адмінів і модераторів фото.</p>
    <input class="input" id="lgEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input class="input" id="lgPass" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <div class="err" id="lgErr"></div>
    <button class="btn primary" id="lgBtn" type="submit" style="width:100%;justify-content:center">Увійти</button>
  </form>
</div>

<div id="app" class="hidden">
  <nav id="side">
    <h2>🛡️ Адмін-панель</h2>
    <div id="nav"></div>
    <div class="grow"></div>
    <a class="nav" id="siteLink" href="#" target="_blank" rel="noopener">🌐 Відкрити сайт</a>
  </nav>
  <div id="content">
    <header id="top">
      <h1 id="pageTitle"></h1>
      <button class="btn small" id="themeBtn" type="button" title="Тема">🌓</button>
      <div class="me"><img class="avatar" id="meAvatar" alt=""><span id="meName"></span><span class="tag" id="meRole"></span></div>
      <button class="btn small" id="logoutBtn" type="button">Вийти</button>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="dlg" class="dlg hidden">
  <div class="dlg-box">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <textarea class="input hidden" id="dlgInput" rows="3"></textarea>
    <div class="err" id="dlgErr"></div>
    <div class="dlg-btns">
      <button class="btn" id="dlgCancel" type="button">Скасувати</button>
      <button class="btn primary" id="dlgOk" type="button">Підтвердити</button>
    </div>
  </div>
</div>
<div id="lightbox" class="hidden"><img alt=""></div>
<div id="toasts"></div>

<script>
/* ============================ НАЛАШТУВАННЯ ============================ */
const SUPABASE_URL = 'https://fslbfqgzpsbkzbzamasa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Et7XDaX49e_J4RqfnoTpcA_e5yHEsS-';
const SITE_URL = 'https://gaimerctrl.github.io/transport/';   // адреса головного сайту
const DELETE_FUNCTION = 'smooth-handler';                      // Edge Function видалення акаунтів

/* ============================ ДОПОМІЖНЕ ============================ */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const RANK = { user: 0, photomod: 1, admin: 2, owner: 3 };
const ROLE_LABEL = { owner: 'OWNER', admin: 'ADMIN', photomod: 'PHOTOMOD', user: 'USER' };
const LOG_LABELS = {
  approve: 'прийняв місто', reject: 'відхилив місто', unpublish: 'зняв з публікації місто', delete: 'видалив місто',
  broadcast: 'надіслав оголошення', ban: 'заблокував акаунт', unban: 'розблокував акаунт',
  photo_approve: 'прийняв фото', photo_reject: 'відхилив фото', delete_account: 'видалив акаунт',
  set_role: 'змінив ранг акаунта', comment_delete: 'видалив коментар'
};
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#cfd3d8"/><circle cx="32" cy="24" r="11" fill="#9aa0a6"/><path d="M10 64c2-17 12-24 22-24s20 7 22 24z" fill="#9aa0a6"/></svg>');

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const fmtDate = s => s ? new Date(s).toLocaleString('uk-UA', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const escLike = s => String(s).replace(/[%_\\]/g, '\\$&');
const phUrl = p => db.storage.from('photos').getPublicUrl(p.path).data.publicUrl;
const userLink = (id, name) => el('a', { href: SITE_URL + '#user=' + id, target: '_blank', rel: 'noopener' }, name || '—');

function toast(msg, kind) {
  const t = el('div', { class: 'toast' + (kind === 'err' ? ' err' : '') }, msg);
  $('toasts').append(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}

function openLightbox(src) {
  $('lightbox').firstElementChild.src = src;
  $('lightbox').classList.remove('hidden');
}
$('lightbox').addEventListener('click', () => $('lightbox').classList.add('hidden'));

/* діалоги: повертають Promise */
let dlgDone = null;
function closeDlg(val) {
  $('dlg').classList.add('hidden');
  if (dlgDone) { const f = dlgDone; dlgDone = null; f(val); }
}
function dialog({ title, text, input, okLabel, danger, required }) {
  return new Promise(resolve => {
    $('dlgTitle').textContent = title;
    $('dlgText').textContent = text || '';
    $('dlgText').classList.toggle('hidden', !text);
    $('dlgInput').classList.toggle('hidden', !input);
    $('dlgInput').value = '';
    $('dlgInput').placeholder = input || '';
    $('dlgErr').textContent = '';
    $('dlgOk').textContent = okLabel || 'Підтвердити';
    $('dlgOk').className = 'btn ' + (danger ? 'danger' : 'primary');
    dlgDone = resolve;
    $('dlg').classList.remove('hidden');
    (input ? $('dlgInput') : $('dlgOk')).focus();
    $('dlgOk').onclick = () => {
      const v = $('dlgInput').value.trim();
      if (input && required && !v) { $('dlgErr').textContent = 'Заповніть це поле'; return; }
      closeDlg(input ? v : true);
    };
  });
}
$('dlgCancel').addEventListener('click', () => closeDlg(null));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('dlg').classList.contains('hidden')) closeDlg(null); $('lightbox').classList.add('hidden'); }
});
const askReason = (title, okLabel, danger = true) => dialog({ title, input: 'Причина', okLabel, danger, required: true });
const askConfirm = (title, text, okLabel, danger) => dialog({ title, text, okLabel, danger });

/* запити */
async function count(table, filter) {
  let q = db.from(table).select('*', { count: 'exact', head: true });
  if (filter) q = filter(q);
  const { count: n, error } = await q;
  return error ? null : n;
}
async function usersMap(ids) {
  const uniq = [...new Set(ids.filter(Boolean))];
  const map = {};
  for (let i = 0; i < uniq.length; i += 100) {
    const { data } = await db.from('profiles').select('id, username, avatar_url, role').in('id', uniq.slice(i, i + 100));
    (data || []).forEach(p => { map[p.id] = p; });
  }
  return map;
}
/* зміна/видалення з перевіркою, що запис справді змінився (RLS мовчки відсікає зайве) */
async function upd(table, patch, id) {
  const { data, error } = await db.from(table).update(patch).eq('id', id).select('id');
  if (error) return error.message;
  if (!data || !data.length) return 'Немає прав або запис не знайдено';
  return '';
}
async function del(table, id) {
  const { data, error } = await db.from(table).delete().eq('id', id).select('id');
  if (error) return error.message;
  if (!data || !data.length) return 'Немає прав або запис не знайдено';
  return '';
}
async function logAction(action, cityName, reason) {
  const { error } = await db.from('staff_log').insert({
    actor_id: me.id, actor_name: me.name || '', action, city_name: cityName || null, reason: reason || null
  });
  if (error) console.error(error);
}
async function notify(uid, message) {
  const { error } = await db.from('notifications').insert({ user_id: uid, message });
  if (error) toast('Сповіщення не надіслано: ' + error.message, 'err');
}

/* ============================ ВХІД / СЕАНС ============================ */
let me = null;
let notice = '';

function showLogin(msg) {
  me = null;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('lgErr').textContent = msg || '';
  $('lgBtn').disabled = false;
}

async function enter(session) {
  if (!session) { showLogin(notice); return; }
  const { data: p } = await db.from('profiles').select('id, username, role, banned, avatar_url').eq('id', session.user.id).maybeSingle();
  if (!p || p.banned || !['owner', 'admin', 'photomod'].includes(p.role)) {
    notice = 'Доступ лише для власника, адмінів і модераторів фото.';
    await db.auth.signOut();
    showLogin(notice);
    return;
  }
  me = { id: p.id, name: p.username, role: p.role, avatar: p.avatar_url };
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('meName').textContent = me.name;
  $('meAvatar').src = me.avatar || PLACEHOLDER;
  $('meRole').textContent = ROLE_LABEL[me.role];
  $('meRole').className = 'tag ' + me.role;
  $('siteLink').href = SITE_URL;
  buildNav();
  route();
  refreshBadges();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  notice = '';
  $('lgBtn').disabled = true;
  $('lgErr').textContent = '';
  const { data, error } = await db.auth.signInWithPassword({ email: $('lgEmail').value.trim(), password: $('lgPass').value });
  if (error) {
    $('lgBtn').disabled = false;
    $('lgErr').textContent = /invalid/i.test(error.message) ? 'Невірна пошта або пароль' : error.message;
    return;
  }
  $('lgPass').value = '';
  await enter(data.session);
});
$('logoutBtn').addEventListener('click', async () => { notice = ''; await db.auth.signOut(); });
$('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('admin-theme', document.documentElement.dataset.theme); } catch (e) { /* ignore */ }
});
try { const t = localStorage.getItem('admin-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }

/* ============================ НАВІГАЦІЯ ============================ */
const PAGES = [
  { id: 'overview', ico: '📊', title: 'Огляд', min: 'admin', render: pgOverview },
  { id: 'users', ico: '👥', title: 'Акаунти', min: 'admin', render: pgUsers },
  { id: 'cities', ico: '🏙️', title: 'Міста', min: 'admin', render: pgCities, badge: 'cities' },
  { id: 'photos', ico: '📷', title: 'Фото', min: 'photomod', render: pgPhotos, badge: 'photos' },
  { id: 'comments', ico: '💬', title: 'Коментарі', min: 'photomod', render: pgComments },
  { id: 'broadcast', ico: '📣', title: 'Оголошення', min: 'admin', render: pgBroadcast },
  { id: 'log', ico: '📜', title: 'Журнал', min: 'admin', render: pgLog }
];
const allowed = p => RANK[me.role] >= RANK[p.min];
let renderTok = 0;

function buildNav() {
  $('nav').replaceChildren(...PAGES.filter(allowed).map(p =>
    el('a', { class: 'nav', href: '#' + p.id, 'data-page': p.id }, el('span', null, p.ico), el('span', null, p.title),
      p.badge ? el('span', { class: 'nbadge hidden', id: 'nb-' + p.badge }) : null)));
}

function route() {
  if (!me) return;
  let id = location.hash.replace('#', '');
  let page = PAGES.find(p => p.id === id);
  if (!page || !allowed(page)) page = PAGES.find(allowed);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page.id));
  $('pageTitle').textContent = page.title;
  $('main').replaceChildren(el('div', { class: 'empty' }, 'Завантаження…'));
  const tok = ++renderTok;
  page.render(tok);
}
window.addEventListener('hashchange', route);

const stale = tok => tok !== renderTok;
function show(...nodes) { $('main').replaceChildren(...nodes); }

async function refreshBadges() {
  const set = (id, n) => { const b = $(id); if (!b) return; b.textContent = n; b.classList.toggle('hidden', !n); };
  if (isAdmin()) set('nb-cities', await count('cities', q => q.eq('submitted', true).eq('is_published', false)));
  set('nb-photos', await count('photos', q => q.eq('status', 'pending')));
}
const isOwner = () => me.role === 'owner';
const isAdmin = () => RANK[me.role] >= RANK.admin;

/* ============================ ОГЛЯД ============================ */

  const [users, banned, cPub, cPend, cDraft, phOk, phPend, cmts] = await Promise.all([
    count('profiles'),
    count('profiles', q => q.eq('banned', true)),
    count('cities', q => q.eq('is_published', true)),
    count('cities', q => q.eq('submitted', true).eq('is_published', false)),
    count('cities', q => q.eq('submitted', false).eq('is_published', false)),
    count('photos', q => q.eq('status', 'approved')),
    count('photos', q => q.eq('status', 'pending')),
    count('photo_comments')
  ]);
  const [logRes, usrRes] = await Promise.all([
    db.from('staff_log').select('*').order('created_at', { ascending: false }).limit(8),

  ]);

  const stat = (n, label, warn) => el('div', { class: 'stat' + (warn && n ? ' warn' : '') }, el('b', null, n == null ? '—' : n.toLocaleString('uk-UA')), el('span', null, label));
  const logRows = (logRes.data || []).map(x => el('div', { class: 'row' },
    el('div', { class: 'info' }, el('p', null, el('b', null, x.actor_name || 'Невідомий'), ' ' + (LOG_LABELS[x.action] || x.action) + (x.city_name ? ' «' + x.city_name + '»' : '')),
      el('p', { class: 'sub' }, fmtDate(x.created_at) + (x.reason ? ' · ' + x.reason : '')))));

    el('div', { class: 'info' }, el('p', null, userLink(u.id, u.username)), el('p', { class: 'sub' }, fmtDate(u.created_at)))));

    el('div', { class: 'cards' },

      stat(cPend, 'Міст на модерації', true), stat(cDraft, 'Чернеток міст'), stat(phOk, 'Фото схвалено'),
      stat(phPend, 'Фото на модерації', true), stat(cmts, 'Коментарів')),
    el('div', { class: 'cols' },
      el('div', { class: 'panel' }, el('h3', null, 'Останні дії персоналу'), logRows.length ? logRows : el('div', { class: 'empty' }, 'Поки порожньо')),
      el('div', { class: 'panel' }, el('h3', null, 'Останні реєстрації'), usrRows.length ? usrRows : el('div', { class: 'empty' }, 'Поки порожньо'))));
}

/* ============================ АКАУНТИ ============================ */
const usersState = { q: '', role: 'all', limit: 50 };

function canManage(t) {
  if (t.id === me.id) return false;
  if (me.role === 'owner') return t.role !== 'owner';
  if (me.role === 'admin') return !['owner', 'admin'].includes(t.role);
  return false;
}

async function pgUsers(tok) {
  const st = usersState;
  let q = db.from('profiles').select('*').order('created_at', { ascending: false }).limit(st.limit);
  if (st.q) q = q.ilike('username', '%' + escLike(st.q) + '%');
  if (st.role === 'banned') q = q.eq('banned', true);
  else if (st.role !== 'all') q = q.eq('role', st.role);
  const { data, error } = await q;
  if (stale(tok)) return;
  const rows = (data || []).map(userRow);
  const search = el('input', { class: 'input', placeholder: 'Пошук за ніком…', value: st.q });
  let timer = null;
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { st.q = search.value.trim(); st.limit = 50; pgUsers(++renderTok); }, 350); });
  const roleSel = el('select', { class: 'input', style: 'max-width:200px' },
    ...[['all', 'Усі'], ['owner', 'Власник'], ['admin', 'Адміни'], ['photomod', 'Фотомодератори'], ['user', 'Користувачі'], ['banned', 'Заблоковані']]
      .map(([v, l]) => el('option', { value: v, selected: st.role === v }, l)));
  roleSel.addEventListener('change', () => { st.role = roleSel.value; st.limit = 50; pgUsers(++renderTok); });
  show(
    el('div', { class: 'toolbar' }, search, roleSel),
    el('div', { class: 'panel' },
      error ? el('div', { class: 'empty' }, error.message) : rows.length ? rows : el('div', { class: 'empty' }, 'Нікого не знайдено'),
      rows.length >= st.limit ? el('div', { class: 'more' }, el('button', { class: 'btn', onclick: () => { st.limit += 50; pgUsers(++renderTok); } }, 'Показати ще')) : null));
}

function userRow(u) {
  const acts = el('div', { class: 'acts' });
  if (canManage(u)) {
    const roles = me.role === 'owner' ? ['user', 'photomod', 'admin'] : ['user', 'photomod'];
    const sel = el('select', { class: 'input', style: 'width:auto;padding:5px 8px', title: 'Ранг' },
      ...roles.map(r => el('option', { value: r, selected: u.role === r }, ROLE_LABEL[r])));
    if (!roles.includes(u.role)) sel.prepend(el('option', { value: u.role, selected: true }, ROLE_LABEL[u.role]));
    sel.addEventListener('change', () => setRole(u, sel.value, sel));
    acts.append(sel,
      el('button', { class: 'btn small' + (u.banned ? ' ok' : ''), onclick: () => toggleBan(u) }, u.banned ? 'Розблокувати' : 'Заблокувати'),
      el('button', { class: 'btn small danger', onclick: () => deleteAccount(u) }, 'Видалити'));
  }
  return el('div', { class: 'row' + (u.banned ? ' banned' : '') },
    el('img', { class: 'avatar', src: u.avatar_url || PLACEHOLDER, alt: '' }),
    el('div', { class: 'info' },
      el('p', null, userLink(u.id, u.username),
        ['owner', 'admin', 'photomod'].includes(u.role) ? el('span', { class: 'tag ' + u.role }, ROLE_LABEL[u.role]) : null,
        u.banned ? el('span', { class: 'tag ban' }, 'БАН') : null),
      el('p', { class: 'sub' }, 'Реєстрація: ' + fmtDate(u.created_at) + (u.banned && u.ban_reason ? ' · Причина бану: ' + u.ban_reason : ''))),
    acts);
}

async function setRole(u, role, sel) {
  if (role === u.role) return;
  const label = { user: 'Користувач', photomod: 'Photomod', admin: 'Admin' }[role];
  const ok = await askConfirm('Змінити ранг', 'Акаунт «' + u.username + '» отримає ранг: ' + label + '.', 'Змінити', false);
  if (!ok) { sel.value = u.role; return; }
  const { error } = await db.rpc('set_role', { target: u.id, new_role: role });
  if (error) { toast(error.message, 'err'); sel.value = u.role; return; }
  await logAction('set_role', u.username, label);
  await notify(u.id, 'Ваш ранг змінено: ' + label);
  toast('Ранг змінено');
  pgUsers(++renderTok);
}

async function toggleBan(u) {
  let reason = null;
  if (!u.banned) {
    reason = await askReason('Причина бану: ' + u.username, 'Заблокувати');
    if (reason == null) return;
  } else if (!(await askConfirm('Розблокувати «' + u.username + '»?', '', 'Розблокувати', false))) return;
  const { error } = await db.rpc('set_ban', { target: u.id, ban: !u.banned, reason });
  if (error) { toast(error.message, 'err'); return; }
  await logAction(u.banned ? 'unban' : 'ban', u.username, reason);
  toast(u.banned ? 'Розблоковано' : 'Заблоковано');
  pgUsers(++renderTok);
}

async function deleteAccount(u) {
  const reason = await askReason('Видалити «' + u.username + '» (причина піде на пошту)', 'Видалити акаунт');
  if (reason == null) return;
  const { data, error } = await db.functions.invoke(DELETE_FUNCTION, { body: { target: u.id, reason } });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (e) { /* ignore */ }
    toast(m, 'err');
    return;
  }
  if (data && data.error) { toast(data.error, 'err'); return; }
  await logAction('delete_account', u.username, reason);
  toast(data && data.mail_error ? 'Акаунт видалено, але лист не надіслано: ' + data.mail_error : 'Акаунт видалено', data && data.mail_error ? 'err' : '');
  pgUsers(++renderTok);
}

/* ============================ МІСТА ============================ */
const citiesState = { tab: 'pending', q: '' };
const CITY_TABS = [
  ['pending', 'На модерації', q => q.eq('submitted', true).eq('is_published', false)],
  ['published', 'Опубліковані', q => q.eq('is_published', true)],
  ['drafts', 'Чернетки', q => q.eq('submitted', false).eq('is_published', false)]
];

async function pgCities(tok) {
  const st = citiesState;
  const tabDef = CITY_TABS.find(t => t[0] === st.tab);
  const [counts, res] = await Promise.all([
    Promise.all(CITY_TABS.map(t => count('cities', t[2]))),
    tabDef[2](db.from('cities').select('*')).order('created_at', { ascending: false }).limit(300)
  ]);
  const authors = await usersMap((res.data || []).map(c => c.owner_id));
  if (stale(tok)) return;
  const q = st.q.toLowerCase();
  const list = (res.data || []).filter(c => !q ||
    [c.name, c.country, c.region, (authors[c.owner_id] || {}).username].some(v => String(v || '').toLowerCase().includes(q)));
  const tabs = el('div', { class: 'tabs' }, ...CITY_TABS.map((t, i) =>
    el('button', { class: 'tab' + (st.tab === t[0] ? ' active' : ''), onclick: () => { st.tab = t[0]; pgCities(++renderTok); } },
      t[1] + (counts[i] != null ? ' (' + counts[i] + ')' : ''))));
  const search = el('input', { class: 'input', placeholder: 'Пошук за містом, країною, автором…', value: st.q });
  search.addEventListener('input', () => { st.q = search.value.trim(); clearTimeout(search._t); search._t = setTimeout(() => pgCities(++renderTok), 350); });
  show(tabs, el('div', { class: 'toolbar' }, search),
    el('div', { class: 'panel' }, res.error ? el('div', { class: 'empty' }, res.error.message) :
      list.length ? list.map(c => cityRow(c, authors[c.owner_id])) : el('div', { class: 'empty' }, 'Тут порожньо')));
}

function cityRow(c, author) {
  const acts = el('div', { class: 'acts' });
  if (isOwner()) {
    if (c.is_published) acts.append(el('button', { class: 'btn small', onclick: () => cityUnpublish(c) }, 'Зняти з публікації'));
    else {
      acts.append(el('button', { class: 'btn small ok', onclick: () => cityApprove(c) }, c.submitted ? 'Прийняти' : 'Опублікувати'));
      if (c.submitted) acts.append(el('button', { class: 'btn small', onclick: () => cityReject(c) }, 'Відхилити'));
    }
  }
  if (isAdmin()) acts.append(el('button', { class: 'btn small danger', onclick: () => cityDelete(c) }, 'Видалити'));
  return el('div', { class: 'row' },
    el('div', { class: 'info' },
      el('p', null, el('b', null, c.name), ' ', el('span', { class: 'sub' }, [c.region, c.country].filter(Boolean).join(', ')),
        c.is_published ? el('span', { class: 'tag ok' }, 'ОПУБЛІКОВАНО') : null),
      el('p', { class: 'sub' }, 'Автор: ', author ? userLink(author.id, author.username) : '—',
        ' · ' + fmtDate(c.created_at) + (c.population ? ' · населення ' + Number(c.population).toLocaleString('uk-UA') : '') +
        (c.reject_reason ? ' · відхилено: ' + c.reject_reason : ''))),
    acts);
}

async function cityReject(c) {

}
async function cityUnpublish(c) {
  const reason = await askReason('Причина зняття з публікації', 'Зняти');
  if (reason == null) return;
  const err = await upd('cities', { is_published: false, submitted: false }, c.id);
  if (err) { toast(err, 'err'); return; }

  await notify(c.owner_id, 'Ваше місто «' + c.name + '» знято з публікації. Причина: ' + reason);

}
async function cityDelete(c) {

/* ============================ ФОТО ============================ */

async function photoApprove(p) {
  const err = await upd('photos', { status: 'approved' }, p.id);

  await logAction('photo_approve', p.city_name, p.enterprise_name);

async function photoReject(p, title, okLabel) {

/* ============================ ОГОЛОШЕННЯ ============================ */
async function pgBroadcast(tok) {
  const text = el('textarea', { class: 'input', rows: 4, placeholder: 'Текст оголошення для всіх користувачів' });
  const msg = el('div', { class: 'err' });
  const sendAll = el('button', { class: 'btn primary', type: 'button' }, 'Надіслати всім');
  const nick = el('input', { class: 'input', placeholder: 'Нік користувача' });
  const text2 = el('textarea', { class: 'input', rows: 3, placeholder: 'Особисте повідомлення' });
  const msg2 = el('div', { class: 'err' });
  const sendOne = el('button', { class: 'btn primary', type: 'button' }, 'Надіслати користувачу');

  sendAll.addEventListener('click', async () => {
    const t = text.value.trim();
    if (!t) { msg.style.color = ''; msg.textContent = 'Введіть текст'; return; }
    if (!(await askConfirm('Надіслати всім?', 'Оголошення отримають усі користувачі сайту.', 'Надіслати', false))) return;
    sendAll.disabled = true; msg.textContent = '';
    const ids = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from('profiles').select('id').order('created_at').range(from, from + 999);
      if (error) { msg.textContent = error.message; sendAll.disabled = false; return; }
      ids.push(...data.map(p => p.id));
      if (data.length < 1000) break;
    }
    for (let i = 0; i < ids.length; i += 500) {
      const { error } = await db.from('notifications').insert(ids.slice(i, i + 500).map(id => ({ user_id: id, message: 'Оголошення: ' + t })));
      if (error) { msg.textContent = error.message; sendAll.disabled = false; return; }
    }
    await logAction('broadcast', null, t);
    text.value = ''; sendAll.disabled = false;
    msg.style.color = 'var(--ok)'; msg.textContent = 'Надіслано користувачам: ' + ids.length;
  });

  sendOne.addEventListener('click', async () => {
    const n = nick.value.trim(), t = text2.value.trim();
    msg2.style.color = '';
    if (!n || !t) { msg2.textContent = 'Вкажіть нік і текст'; return; }
    const { data } = await db.from('profiles').select('id, username').ilike('username', escLike(n)).maybeSingle();
    if (!data) { msg2.textContent = 'Користувача не знайдено'; return; }
    const { error } = await db.from('notifications').insert({ user_id: data.id, message: t });
    if (error) { msg2.textContent = error.message; return; }
    text2.value = ''; msg2.style.color = 'var(--ok)'; msg2.textContent = 'Надіслано: ' + data.username;
  });

  if (stale(tok)) return;
  show(
    el('div', { class: 'panel' }, el('h3', null, '📣 Оголошення всім'), el('div', { class: 'form' }, text, msg, el('div', null, sendAll))),
    el('div', { class: 'panel' }, el('h3', null, '✉️ Повідомлення одному користувачу'), el('div', { class: 'form' }, nick, text2, msg2, el('div', null, sendOne))));
}

/* ============================ ЖУРНАЛ ============================ */
const logState = { action: 'all', q: '' };

async function pgLog(tok) {
  const st = logState;
  let q = db.from('staff_log').select('*').order('created_at', { ascending: false }).limit(300);
  if (st.action !== 'all') q = q.eq('action', st.action);
  const { data, error } = await q;
  if (stale(tok)) return;
  const f = st.q.toLowerCase();
  const list = (data || []).filter(x => !f || [x.actor_name, x.city_name, x.reason, LOG_LABELS[x.action]].some(v => String(v || '').toLowerCase().includes(f)));
  const sel = el('select', { class: 'input', style: 'max-width:240px' },
    el('option', { value: 'all' }, 'Усі дії'),
    ...Object.entries(LOG_LABELS).map(([k, l]) => el('option', { value: k, selected: st.action === k }, l)));
  sel.addEventListener('change', () => { st.action = sel.value; pgLog(++renderTok); });
  const search = el('input', { class: 'input', placeholder: 'Пошук…', value: st.q });
  search.addEventListener('input', () => { st.q = search.value.trim(); clearTimeout(search._t); search._t = setTimeout(() => pgLog(++renderTok), 300); });
  show(el('div', { class: 'toolbar' }, sel, search),
    el('div', { class: 'panel' }, error ? el('div', { class: 'empty' }, error.message) : list.length ? list.map(x =>
      el('div', { class: 'row' }, el('div', { class: 'info' },
        el('p', null, el('b', null, x.actor_name || 'Невідомий'), ' ' + (LOG_LABELS[x.action] || x.action) + (x.city_name ? ' «' + x.city_name + '»' : '')),
        x.reason ? el('p', null, (x.action === 'broadcast' ? 'Текст: ' : 'Причина: ') + x.reason) : null,
        el('p', { class: 'sub' }, fmtDate(x.created_at))))) : el('div', { class: 'empty' }, 'Записів немає')));
}

/* ============================ СТАРТ ============================ */
(async function boot() {
  const { data } = await db.auth.getSession();
  await enter(data.session);
  db.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') enter(null); });
})();
</script>
